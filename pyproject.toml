[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "settlediff"
version = "0.1.0"
description = "Deterministic verification for agent-initiated purchases"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2",
  "opentelemetry-sdk>=1.44,<2",
  "pydantic>=2.11,<3",
  "pydantic-ai-slim[openai]>=1,<2",
  "pydantic-settings>=2.10,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
settlediff = "settlediff.cli:app"

[dependency-groups]
dev = [
  "dirty-equals>=0.9,<1",
  "hypothesis>=6.138,<7",
  "inline-snapshot>=0.29,<1",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.coverage.run]
branch = true
source = ["settlediff"]

[tool.hatch.build.targets.wheel]
packages = ["src/settlediff"]

[tool.pyright]
include = ["scripts", "src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "offline: deterministic test that must not use external services",
  "live_hyperfusion: opt-in live Hyperfusion compatibility test",
  "live_contextdev: opt-in live Context.dev contract that consumes one credit",
  "paid: opt-in paid Perflo smoke test requiring explicit authorization",
]

[tool.ruff]
extend-exclude = ["docs"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
