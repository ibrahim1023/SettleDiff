name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    name: Offline quality gate (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.12', '3.13']
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv
        uses: astral-sh/setup-uv@b75a909f75acd358c2196fb9a5f1299a9a8868a4 # v6.7.0
        with:
          enable-cache: true
      - name: Install Python
        run: uv python install ${{ matrix.python }}
      - name: Verify lockfile
        run: uv lock --check
      - name: Sync environment
        run: uv sync --locked --all-groups --python ${{ matrix.python }}
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run pyright
      - name: Test offline suite
        run: uv run --python ${{ matrix.python }} pytest -m "not live and not paid" --cov=settlediff --cov-branch --cov-report=term --cov-fail-under=91
      - name: Check documentation
        run: uv run python scripts/check_docs.py
